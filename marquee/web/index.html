<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marquee - emotion in film reviews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Marquee</span>
  </header>

  <main class="workspace">
    <section class="browser" aria-labelledby="browser-title">
      <h1 class="sr-only" id="browser-title">Choose a film</h1>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">Search films by title</label>
        <input class="search-input" id="search-input" type="search" name="query"
               placeholder="Search by title" autocomplete="off" spellcheck="false">
      </form>
      <h2 class="list-heading" id="list-heading"></h2>
      <ul class="movie-list" id="movie-list"></ul>
    </section>

    <section class="analysis" id="analysis" aria-live="polite" aria-label="Emotion analysis"></section>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
